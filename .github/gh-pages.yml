name: Publish chart from Elasticsearch Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest dataset to Elasticsearch Cloud
        env:
          ES_CLOUD_ID: ${{ secrets.ES_CLOUD_ID }}
          ES_USER: ${{ secrets.ES_USER }}
          ES_PASS: ${{ secrets.ES_PASS }}
          ES_INDEX: dataset_index
        run: python ingest.py

      - name: Generate Plotly chart
        env:
          ES_CLOUD_ID: ${{ secrets.ES_CLOUD_ID }}
          ES_USER: ${{ secrets.ES_USER }}
          ES_PASS: ${{ secrets.ES_PASS }}
          ES_INDEX: dataset_index
        run: python plot_from_es.py

      - name: Commit and push docs
        uses: EndBug/add-and-commit@v9
        with:
          add: "docs"
          message: "update: regenerate chart from ES Cloud"
          push: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
